name: Crear compras de TuBroadcast en App Store Connect

# Crea (o completa) las 16 suscripciones y los 4 pases de 24 horas de TuBroadcast,
# con precios en todos los países de la app y los avisos V2 al Panel Tukán Central.
# Se puede correr varias veces: lo que ya existe no se duplica.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "crear (planes de TuBroadcast), capturas (revisión de TuBroadcast), diagnostico (solo lee el estado de las compras de TuBroadcast) o envivo (compras de EN VIVO Tycoon)"
        required: true
        default: "crear"

concurrency:
  group: crear-compras
  cancel-in-progress: false

jobs:
  crear:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ASC_KEY_ID: L2M6297P3F
      ASC_ISSUER_ID: 3b2124e5-8b34-4b8b-8641-57b8f76dc992
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - name: Instalar lo necesario
        run: pip install --quiet pyjwt cryptography
      - name: Revisar la lista (sin Apple)
        run: python3 herramientas/crear_compras.py probar
      - name: Crear en App Store Connect
        if: github.event.inputs.modo == 'crear'
        run: python3 herramientas/crear_compras.py
      - name: Compras de EN VIVO Tycoon (publicacion/compras/envivo.json)
        if: github.event.inputs.modo == 'envivo'
        run: python3 herramientas/crear_compras.py lista com.tukanec.envivo publicacion/compras/envivo.json publicacion/capturas/envivo/revision
      - name: Subir las capturas de revisión (publicacion/capturas/tubroadcast/revision)
        if: github.event.inputs.modo == 'capturas'
        run: python3 herramientas/crear_compras.py capturas publicacion/capturas/tubroadcast/revision
      - name: Diagnóstico de las compras de TuBroadcast (solo lee)
        if: github.event.inputs.modo == 'diagnostico' || github.event.inputs.modo == 'crear'
        run: python3 herramientas/crear_compras.py diagnostico
      - name: TEMPORAL experimento
        if: github.event.inputs.modo == 'experimento'
        run: python3 herramientas/crear_compras.py experimento
      - name: TEMPORAL especificacion OpenAPI
        if: github.event.inputs.modo == 'experimento'
        run: |
          curl -sSL -o /tmp/spec.zip https://developer.apple.com/sample-code/app-store-connect/app-store-connect-openapi-specification.zip
          cd /tmp && unzip -o -q spec.zip
          python3 - <<'PY'
          import json, re
          d = json.load(open('/tmp/openapi.oas.json'))
          for path in ('/v1/subscriptionPriceTiers', '/v1/subscriptions/{id}/prices', '/v1/subscriptions/{id}/pricePoints', '/v1/subscriptionPricePoints/{id}/adjustedEqualizations', '/v1/subscriptionPricePoints/{id}/equalizations', '/v1/subscriptionSubmissions'):
              for m, op in d['paths'][path].items():
                  if m == 'parameters': continue
                  print('PATH', m.upper(), path, op.get('summary'), '|', (op.get('description') or '')[:400])
                  print('   params:', [p.get('name') if 'name' in p else p.get('$ref') for p in op.get('parameters', [])])
          txt = json.dumps(d)
          for w in ('multiSeat', 'MultiSeat', 'minQuantity', 'marketSettings', 'adjustedEqualizations'):
              for m in re.finditer(w, txt):
                  pass
              print(w, txt.count(w))
          for k, v in d['components']['schemas'].items():
              if 'Equalized' in k or 'Submission' in k and 'Subscription' in k:
                  print('###', k, json.dumps(v)[:1200])
          PY
