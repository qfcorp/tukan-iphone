name: TuBroadcast
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  HaishinKit:
    url: https://github.com/HaishinKit/HaishinKit.swift
    exactVersion: 2.3.0
targets:
  TuBroadcast:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets
    dependencies:
      - package: HaishinKit
        product: HaishinKit
      - package: HaishinKit
        product: RTMPHaishinKit
      - package: HaishinKit
        product: SRTHaishinKit
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: TuBroadcast
        CFBundleName: TuBroadcast
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: es
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ColorFondo
        UIRequiresFullScreen: true
        NSCameraUsageDescription: Para transmitir en vivo el video de la camara.
        NSMicrophoneUsageDescription: Para transmitir en vivo el audio del microfono.
        NSPhotoLibraryAddUsageDescription: Para guardar las grabaciones en la Galeria.
        NSLocalNetworkUsageDescription: Para enviar el video a vMix u OBS en la misma red.
        UIBackgroundModes: [audio]
        CFBundleURLTypes:
          - CFBundleURLName: com.tukansoftware.tubroadcast
            CFBundleURLSchemes: [tubroadcast]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tukansoftware.tubroadcast
        PRODUCT_NAME: TuBroadcast
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_STYLE: Automatic
